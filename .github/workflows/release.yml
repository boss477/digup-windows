# Publish a GitHub Release with the validated Windows preview zip.
#
#   git tag v0.1.3 && git push --tags
#
#   tag v*       : verify the tag matches Cargo.toml, run full validation, publish
#   manual run   : same, but nothing is published unless "publish" is ticked
#
# Safe to re-run: an existing release is updated, not duplicated.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check against (e.g. v0.1.3)'
        required: true
      publish:
        description: 'Really publish (otherwise validate only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version v$VERSION"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: verify
    uses: ./.github/workflows/windows-validation.yml

  publish:
    name: publish release
    needs: [verify, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-and-validation
          path: artifact
      - name: Checksums
        shell: bash
        run: |
          mkdir release
          cp artifact/dist/*.zip release/
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "DigUp $TAG (preview)" \
              --generate-notes --prerelease --verify-tag
          fi
