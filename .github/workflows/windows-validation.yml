name: Windows headless validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Build, test and lint
        run: ./build.ps1
      - name: Collect pinned notices and package
        run: |
          ./fetch-upstream-notices.ps1
          ./package.ps1 -SkipBuild
      - name: Verify installer data preservation
        run: ./verify-install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview-and-validation
          path: |
            dist/*.zip
            verify-package.ps1
            verify-clean-install.ps1
          if-no-files-found: error
          retention-days: 14

  fresh-vm-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview-and-validation
          path: validation
      - name: Test package without checkout, compilation or models
        run: |
          $archive = Get-ChildItem ./validation/dist/*.zip | Select-Object -ExpandProperty FullName
          ./validation/verify-package.ps1 -Archive $archive
          ./validation/verify-clean-install.ps1 -Archive $archive
      - name: Record tested environment
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture
          Write-Host 'Headless fresh hosted Windows VM validation; not consumer Windows 11 GUI/GPU certification.'
