[package]
name = "digup-windows"
version = "0.1.2"
edition = "2021"

[dependencies]
eframe = "0.31"
rfd = "0.15"
walkdir = "2"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
lopdf = { version = "0.42", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
notify = "8"
tray-icon = "0.26"
global-hotkey = "0.8"
tempfile = "3"

[profile.release]
lto = true
strip = true
